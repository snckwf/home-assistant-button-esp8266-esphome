# =====================================================================
#  Pulsante fisico per Home Assistant - LOLIN (Wemos) D1 mini v4 (ESP8266, 4MB, USB-C) - ESPHome
#  Pulsante  : GPIO14 (serigrafia D5 o 14) verso GND (pull-up interno)
#  LED       : GPIO12 (serigrafia D6 o 12) -> resistenza 220-330 ohm -> LED -> GND
#  LED acceso = dispositivo ON | spento = OFF
#  Lampeggio veloce = WiFi assente | lento = Home Assistant non collegato
# =====================================================================

substitutions:
  name: pulsante-ha
  friendly_name: Pulsante HA
  target: switch.presa_smart       # <-- metti qui la TUA entita'

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini
  restore_from_flash: true            # ricorda luminosita' e abilitazione

preferences:
  flash_write_interval: 5min

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server              # aggiornamento firmware dalla pagina web

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                                  # rete di emergenza se il WiFi non va
    ssid: "Pulsante-HA-Setup"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    username: admin
    password: !secret web_password

# ---------------------------------------------------------------------
binary_sensor:
  # Stato del dispositivo letto da Home Assistant
  - platform: homeassistant
    id: stato_dispositivo
    name: "Stato dispositivo"
    entity_id: ${target}

  # Pulsante fisico
  - platform: gpio
    id: pulsante
    name: "Pulsante"
    pin:
      number: GPIO14   # D5
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - if:
          condition:
            and:
              - switch.is_on: abilita_pulsante
              - api.connected:
          then:
            - homeassistant.action:
                action: switch.toggle
                data:
                  entity_id: ${target}

# ---------------------------------------------------------------------
output:
  - platform: esp8266_pwm
    id: led_out
    pin: GPIO12        # D6
    frequency: 1000 Hz

number:
  - platform: template
    id: luminosita
    name: "Luminosita LED"
    icon: mdi:brightness-6
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true

switch:
  - platform: template
    id: abilita_pulsante
    name: "Pulsante abilitato"
    icon: mdi:gesture-tap-button
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

button:
  - platform: restart
    name: "Riavvia"

sensor:
  - platform: wifi_signal
    name: "Segnale WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Indirizzo IP"

# ---------------------------------------------------------------------
# Gestione LED ogni 250 ms
interval:
  - interval: 250ms
    then:
      - lambda: |-
          static uint8_t tick = 0;
          tick++;
          float lvl = id(luminosita).state / 100.0f;
          if (isnan(lvl) || lvl <= 0.0f) lvl = 1.0f;

          bool wifi_ok = wifi::global_wifi_component->is_connected();
          bool api_ok  = api::global_api_server != nullptr &&
                         api::global_api_server->is_connected();

          if (!wifi_ok) {                       // lampeggio veloce
            id(led_out).set_level((tick & 1) ? lvl : 0.0f);
            return;
          }
          if (!api_ok || !id(stato_dispositivo).has_state()) {  // lampeggio lento
            id(led_out).set_level((tick & 4) ? lvl : 0.0f);
            return;
          }
          id(led_out).set_level(id(stato_dispositivo).state ? lvl : 0.0f);
