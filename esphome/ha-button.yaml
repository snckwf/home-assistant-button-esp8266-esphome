# =====================================================================
#  Physical button for Home Assistant - LOLIN (Wemos) D1 mini v4 (ESP8266, 4MB, USB-C) - ESPHome
#  Button : GPIO14 (silkscreen D5 or 14) to GND (internal pull-up)
#  LED    : GPIO12 (silkscreen D6 or 12) -> 220-330 ohm resistor -> LED -> GND
#  LED on = device ON | off = OFF
#  Fast blink = no WiFi | slow blink = Home Assistant not connected
# =====================================================================

substitutions:
  name: ha-button
  friendly_name: HA Button
  target: switch.smart_plug        # <-- put YOUR entity here

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini
  restore_from_flash: true            # remembers brightness and enable state

preferences:
  flash_write_interval: 5min

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server              # firmware update from the web page

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                                  # fallback network if the WiFi is down
    ssid: "HA-Button-Setup"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    username: admin
    password: !secret web_password

# ---------------------------------------------------------------------
binary_sensor:
  # Device state read from Home Assistant
  - platform: homeassistant
    id: device_state
    name: "Device state"
    entity_id: ${target}

  # Physical button
  - platform: gpio
    id: button_in
    name: "Button"
    pin:
      number: GPIO14   # D5
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - if:
          condition:
            and:
              - switch.is_on: button_enabled
              - api.connected:
          then:
            - homeassistant.action:
                action: switch.toggle
                data:
                  entity_id: ${target}

# ---------------------------------------------------------------------
output:
  - platform: esp8266_pwm
    id: led_out
    pin: GPIO12        # D6
    frequency: 1000 Hz

number:
  - platform: template
    id: led_brightness
    name: "LED brightness"
    icon: mdi:brightness-6
    entity_category: config
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 100
    optimistic: true
    restore_value: true

switch:
  - platform: template
    id: button_enabled
    name: "Button enabled"
    icon: mdi:gesture-tap-button
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

button:
  - platform: restart
    name: "Restart"

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"

# ---------------------------------------------------------------------
# LED handling every 250 ms
interval:
  - interval: 250ms
    then:
      - lambda: |-
          static uint8_t tick = 0;
          tick++;
          float lvl = id(led_brightness).state / 100.0f;
          if (isnan(lvl) || lvl <= 0.0f) lvl = 1.0f;

          bool wifi_ok = wifi::global_wifi_component->is_connected();
          bool api_ok  = api::global_api_server != nullptr &&
                         api::global_api_server->is_connected();

          if (!wifi_ok) {                       // fast blink
            id(led_out).set_level((tick & 1) ? lvl : 0.0f);
            return;
          }
          if (!api_ok || !id(device_state).has_state()) {  // slow blink
            id(led_out).set_level((tick & 4) ? lvl : 0.0f);
            return;
          }
          id(led_out).set_level(id(device_state).state ? lvl : 0.0f);
